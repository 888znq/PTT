<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family PTT Channel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0420;
      --surface: #0f0420;
      --border: rgba(255, 255, 255, 0.15);
      --accent: #b388ff;
      --accent-dim: rgba(179, 136, 255, 0.12);
      --accent-glow: rgba(179, 136, 255, 0.4);
      --text: #ffffff;
      --muted: #888888;
      --danger: #ff4d6d;
      --success: #00e5a0;
      --warning: #ffd166;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(179,136,255,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(149,76,255,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .app {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header { text-align: center; padding: 1.5rem 0 0.5rem; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .logo-icon { width: 32px; height: 32px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px var(--accent-glow); }
    .logo-icon svg { color: #ffffff; }
    h1 { font-family: 'IBM Plex Mono', monospace; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.05em; }
    .subtitle { font-size: 0.8rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; transition: border-color 0.3s; }
    .card-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-label::before { content: ''; display: inline-block; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }
    
    .status-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.6rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .status-dot.speaking { animation: pulseSpeak 0.8s ease-in-out infinite; }
    @keyframes pulseSpeak { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    
    input[type="text"] { width: 100%; background: #0f0420; border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; color: var(--text); outline: none; margin-bottom: 1rem; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }

    .btn { background: var(--accent-dim); color: #ffffff; border: 1px solid var(--accent); border-radius: 6px; padding: 0.8rem 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; font-weight: 600; cursor: pointer; letter-spacing: 0.03em; width: 100%; transition: all 0.15s ease; }
    .btn:hover:not(:disabled) { background: rgba(179,136,255,0.2); box-shadow: 0 0 16px var(--accent-glow); }
    .btn:disabled { background: rgba(255,255,255,0.04); color: var(--muted); border-color: var(--border); cursor: not-allowed; box-shadow: none; }

    .members-list { list-style: none; padding: 0; margin: 0; }
    .members-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; }
    .members-list li:last-child { margin-bottom: 0; }
    .member-name { display: flex; align-items: center; gap: 10px; }
    
    .buzz-member-btn { background: transparent; border: 1px solid var(--warning); color: var(--warning); border-radius: 6px; padding: 0.3rem 0.6rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 600; cursor: pointer; letter-spacing: 0.03em; width: auto; transition: all 0.15s ease; }
    .buzz-member-btn:hover:not(:disabled) { background: rgba(255,209,102,0.15); box-shadow: 0 0 10px rgba(255,209,102,0.35); }
    .buzz-member-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .buzz-all-btn { background: var(--accent-dim); border: 1px solid var(--warning); color: var(--warning); margin-top: 0.75rem; }
    
    body.incoming-buzz { animation: buzzFlash 0.5s ease-in-out 6; }
    @keyframes buzzFlash { 0%, 100% { background: var(--bg); } 50% { background: rgba(255,209,102,0.25); } }
    
    .buzz-toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 50; background: var(--surface); border: 1px solid var(--warning); border-radius: 8px; padding: 0.7rem 1.2rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; box-shadow: 0 0 20px rgba(255,209,102,0.4); display: none; align-items: center; gap: 0.5rem; }
    .buzz-toast.show { display: flex; }

    .ptt-btn { height: 100px; border-radius: 12px; font-size: 1rem; margin-bottom: 1rem; -webkit-user-select: none; user-select: none; transition: background 0.1s, transform 0.1s; touch-action: none; }
    .ptt-btn:active, .ptt-btn.active { transform: scale(0.96); background: var(--success); color: #000; box-shadow: 0 0 20px rgba(0, 229, 160, 0.4); border-color: var(--success); }
    
    .lock-btn { background: transparent; border-color: var(--border); }
    .lock-btn.locked { background: var(--danger); border-color: var(--danger); color: white; box-shadow: 0 0 16px rgba(255, 77, 109, 0.4); }

    .divider { display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem; font-family: 'IBM Plex Mono', monospace; margin-bottom: 1rem; color: var(--muted); }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .waveform { display: none; align-items: center; justify-content: center; gap: 3px; height: 24px; margin-bottom: 1rem; }
    .waveform.active { display: flex; }
    .waveform span { display: block; width: 3px; border-radius: 3px; background: var(--success); animation: wave 1.2s ease-in-out infinite; }
    .waveform span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .waveform span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .waveform span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    .waveform span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
    .waveform span:nth-child(5) { height: 8px; animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
  </style>
</head>

      if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'BUZZED'; }
      
      try {
        await addDoc(collection(db, 'family_buzz'), {
          sender: myUid, senderName: myName, receiver: targetUid, timestamp: now
        });
      } catch (e) { console.error('Buzz send error', e); }
      
      relayPushBuzz(targetUid);
      
      if (btnEl) {
        setTimeout(() => { btnEl.disabled = false; btnEl.textContent = originalText; }, BUZZ_COOLDOWN_MS);
      }
    }

    function handleBuzzDoc(docSnap) {
      const data = docSnap.data();
      if (data.sender !== myUid) {
        triggerIncomingBuzz(data.senderName || 'Someone');
      }
      deleteDoc(doc(db, 'family_buzz', docSnap.id)).catch(() => {});
    }

    function listenForBuzzes() {
      const qMine = query(collection(db, 'family_buzz'), where('receiver', '==', myUid));
      onSnapshot(qMine, (snapshot) => {
        snapshot.docChanges().forEach((change) => { if (change.type === 'added') handleBuzzDoc(change.doc); });
      });

      const qAll = query(collection(db, 'family_buzz'), where('receiver', '==', 'all'));
      onSnapshot(qAll, (snapshot) => {
        snapshot.docChanges().forEach((change) => { if (change.type === 'added') handleBuzzDoc(change.doc); });
      });
    }

    const buzzAllBtnEl = document.getElementById('buzzAllBtn');
    buzzAllBtnEl.onclick = () => sendBuzz('all', buzzAllBtnEl);

    const chatMessagesEl = document.getElementById('chatMessages');
    const chatInputEl = document.getElementById('chatInput');
    const chatSendBtnEl = document.getElementById('chatSendBtn');

    function appendChatMessage(data) {
      const row = document.createElement('div');
      const isMe = data.sender === myUid;
      row.style.color = isMe ? '#00e5a0' : '#ffffff';
      
      const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      row.textContent = `[${time}] ${data.senderName || 'Someone'}${isMe ? ' (You)' : ''}: ${data.text}`;
      
      chatMessagesEl.appendChild(row);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    async function sendChatMessage() {
      const text = chatInputEl.value.trim();
      if (!text) return;
      chatInputEl.value = '';
      try {
        await addDoc(collection(db, 'family_chat'), {
          sender: myUid, senderName: myName, text: text, timestamp: Date.now()
        });
      } catch (e) { console.error('Chat send error', e); }
    }

    chatSendBtnEl.onclick = sendChatMessage;
    chatInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
    });

    function listenForChat() {
      const qChat = query(collection(db, 'family_chat'), orderBy('timestamp', 'asc'), limit(50));
      onSnapshot(qChat, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added') appendChatMessage(change.doc.data());
        });
      });
    }

    function createPeer(targetUid) {
      const pc = new RTCPeerConnection(servers);
      candidateQueues[targetUid] = [];

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        let audio = document.getElementById('audio-' + targetUid);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'audio-' + targetUid;
          audio.autoplay = true;
          document.getElementById('audioContainer').appendChild(audio);
        }
        audio.srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          addDoc(collection(db, 'family_signals'), {
            sender: myUid, receiver: targetUid, type: 'candidate', payload: JSON.stringify(event.candidate.toJSON())
          });
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
          if (peers[targetUid]) {
            peers[targetUid].close();
            delete peers[targetUid];
          }
        }
      };

      peers[targetUid] = pc;
      return pc;
    }

    function processQueuedCandidates(targetUid, pc) {
      if (candidateQueues[targetUid]) {
        candidateQueues[targetUid].forEach(cand => pc.addIceCandidate(cand).catch(console.error));
        candidateQueues[targetUid] = [];
      }
    }

    function listenForSignals() {
      const q = query(collection(db, 'family_signals'), where('receiver', '==', myUid));
      onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach(async (change) => {
          if (change.type === 'added') {
            const data = change.doc.data();
            const sender = data.sender;
            const payload = JSON.parse(data.payload);

            deleteDoc(doc(db, 'family_signals', change.doc.id)).catch(() => {});

            try {
              if (data.type === 'offer') {
                const pc = createPeer(sender);
                await pc.setRemoteDescription(new RTCSessionDescription(payload));
                processQueuedCandidates(sender, pc);
                
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                await addDoc(collection(db, 'family_signals'), {
                  sender: myUid, receiver: sender, type: 'answer', payload: JSON.stringify(answer)
                });
              } else if (data.type === 'answer') {
                const pc = peers[sender];
                if (pc) {
                  await pc.setRemoteDescription(new RTCSessionDescription(payload));
                  processQueuedCandidates(sender, pc);
                }
              } else if (data.type === 'candidate') {
                const pc = peers[sender];
                const candidate = new RTCIceCandidate(payload);
                if (pc && pc.remoteDescription) {
                  await pc.addIceCandidate(candidate);
                } else {
                  candidateQueues[sender] = candidateQueues[sender] || [];
                  candidateQueues[sender].push(candidate);
                }
              }
            } catch (e) {
              console.error("Signal handling error", e);
            }
          }
        });
      });
    }

    function listenForPresence() {
      const membersList = document.getElementById('membersList');
      
      onSnapshot(collection(db, 'family_presence'), (snapshot) => {
        membersList.innerHTML = '';
        
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const uid = docSnap.id;
          
          const li = document.createElement('li');
          const nameWrap = document.createElement('div');
          nameWrap.className = 'member-name';
          
          const dot = document.createElement('span');
          dot.className = 'status-dot ' + (data.online ? 'connected' : 'error') + (data.speaking ? ' speaking' : '');
          nameWrap.appendChild(dot);
          
          const label = data.name + (uid === myUid ? ' (You)' : '') + (data.speaking ? ' \uD83D\uDD0A' : '') + (data.hasMic === false ? ' \uD83D\uDD07' : '');
          nameWrap.appendChild(document.createTextNode(label));
          li.appendChild(nameWrap);
          
          if (uid !== myUid) {
            const buzzBtn = document.createElement('button');
            buzzBtn.className = 'buzz-member-btn';
            buzzBtn.textContent = 'BUZZ';
            
            const cooldownEnd = buzzCooldowns[uid];
            if (cooldownEnd && Date.now() < cooldownEnd) {
              buzzBtn.disabled = true;
              buzzBtn.textContent = 'BUZZED';
            } else {
              buzzBtn.disabled = !data.online;
            }
            buzzBtn.onclick = () => sendBuzz(uid, buzzBtn);
            li.appendChild(buzzBtn);
          }
          
          membersList.appendChild(li);

          if (data.online && uid !== myUid && myUid > uid) {
            if (!peers[uid] || peers[uid].connectionState === 'closed') {
              initiateCall(uid);
            }
          }
        });
      });
    }

    async function initiateCall(targetUid) {
      const pc = createPeer(targetUid);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await addDoc(collection(db, 'family_signals'), {
        sender: myUid, receiver: targetUid, type: 'offer', payload: JSON.stringify(offer)
      });
    }

    async function subscribeToPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (!GLITCH_WORKER_URL || !VAPID_PUBLIC_KEY || GLITCH_WORKER_URL.includes('YOUR-GLITCH-PROJECT')) return;
      
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const registration = await navigator.serviceWorker.ready;
        let sub = await registration.pushManager.getSubscription();
        if (!sub) {
          sub = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }
        await setDoc(doc(db, 'family_push_subscriptions', myUid), {
          subscription: JSON.stringify(sub.toJSON()),
          name: myName,
          updatedAt: Date.now()
        });
      } catch (e) {
        console.warn('Push subscription failed', e);
      }
    }

    async function relayPushBuzz(targetUid) {
      if (!GLITCH_WORKER_URL || !VAPID_PUBLIC_KEY || GLITCH_WORKER_URL.includes('YOUR-GLITCH-PROJECT')) return;
      try {
        let targetDocs = [];
        
        if (targetUid === 'all') {
          const q = query(collection(db, 'family_push_subscriptions'));
          const snap = await getDocs(q);
          snap.forEach(d => { if (d.id !== myUid) targetDocs.push(d.data().subscription) });
        } else {
          const docSnap = await getDoc(doc(db, 'family_push_subscriptions', targetUid));
          if (docSnap.exists()) targetDocs.push(docSnap.data().subscription);
        }

        for (const subStr of targetDocs) {
          const subObj = JSON.parse(subStr);
          await fetch(GLITCH_WORKER_URL + '/buzz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subscription: subObj, senderName: myName })
          });
        }
      } catch (e) {
        console.warn('Push relay failed', e);
      }
    }

    document.getElementById('joinBtn').onclick = async () => {
      const name = userNameInput.value.trim();
      if (!name) return alert("Please enter a name.");
      
      localStorage.setItem('myName', name);
      myName = name;

      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = "Connecting to Network...";

      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
        localStream.getAudioTracks().forEach(t => t.enabled = false);
        hasMic = true;
      } catch (e) {
        console.warn('Mic unavailable, joining in listen/chat-only mode', e);
        localStream = null;
        hasMic = false;
      }

      updateMicState();

      if (!hasMic) {
        pttBtn.disabled = true;
        pttBtn.textContent = "NO MIC (LISTEN / CHAT ONLY)";
        lockBtn.disabled = true;
      }

      try {
        await setDoc(doc(db, 'family_presence', myUid), {
          name: myName,
          online: true,
          speaking: false,
          hasMic: hasMic,
          lastSeen: Date.now()
        });
        hasJoined = true;
        
        subscribeToPush();

        listenForSignals();
        listenForPresence();
        listenForBuzzes();
        listenForChat();

        window.addEventListener('beforeunload', () => {
          setDoc(doc(db, 'family_presence', myUid), { name: myName, online: false, speaking: false }, { merge: true });
        });

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('channelScreen').style.display = 'flex';
        
      } catch (e) {
        console.error(e);
        alert("Could not connect to Firestore. Check console and security rules.");
        btn.disabled = false;
        btn.textContent = "Connect to Network";
      }
    };
  </script>
